name: appliance

# Mirrors .gitlab-ci.yml; both drive the same ci/*.sh scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      variants:
        description: Which variants to build
        type: choice
        default: both
        options: [both, vanilla, vpp]
      qemu_accel:
        description: QEMU accelerator for the boot tests
        type: choice
        default: tcg
        options: [tcg, kvm]
      publish_release:
        description: Attach the output to a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  DISK_SIZE: "4G"
  # Release assets are capped at 2 GiB and the raw image is 4 GiB
  PUBLISH_RAW_IMG: "false"

jobs:
  # A build costs hours, so gate it on the checks that cost seconds
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: bash ci/static-check.sh

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.variants == 'vanilla' && '["vanilla"]' || github.event.inputs.variants == 'vpp' && '["vpp"]' || '["vanilla","vpp"]') }}
    concurrency:
      group: frr-appliance-${{ matrix.variant }}
      cancel-in-progress: false
    env:
      APPLIANCE_VARIANT: ${{ matrix.variant }}
      QEMU_ACCEL: ${{ github.event.inputs.qemu_accel || 'tcg' }}
      # finalize-artifacts.sh puts these in the build manifest and provenance
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CI_RUNNER_DESCRIPTION: github-hosted ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build, verify, boot-test and sign
        run: |
          set -euo pipefail

          # Each variant builds on the Debian release it targets
          case "$APPLIANCE_VARIANT" in
            vanilla) builder=debian:13-slim ;;
            vpp)     builder=debian:12-slim ;;
            *) echo "unknown variant: $APPLIANCE_VARIANT" >&2; exit 2 ;;
          esac

          # build.sh takes this from git, which the slim builder lacks
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH

          accel=()
          if [[ -e /dev/kvm ]]; then accel=(--device /dev/kvm); fi

          # Forwarding ACTIONS_ID_TOKEN_REQUEST_* rather than a token lets cosign
          # mint its own when it signs, hours after this step starts. --privileged
          # is needed for the loop devices and chroot the build uses
          docker run --rm --privileged "${accel[@]}" \
            --volume "$GITHUB_WORKSPACE:/build" \
            --workdir /build \
            --env APPLIANCE_VARIANT \
            --env DEBIAN_FRONTEND \
            --env DISK_SIZE \
            --env QEMU_ACCEL \
            --env PUBLISH_RAW_IMG \
            --env SOURCE_DATE_EPOCH \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env CI_COMMIT_SHA \
            --env CI_PROJECT_URL \
            --env CI_PIPELINE_URL \
            --env CI_RUNNER_DESCRIPTION \
            "$builder" \
            bash -c 'bash ci/install-build-deps.sh && bash ci/pipeline.sh "$APPLIANCE_VARIANT"'

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.variant }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            out/*.json
            out/*.txt
            out/*.env
            out/*SHA256SUMS
            out/*.sigstore.json
            work/*/smoke/*.log
            work/*/smoke/*.selftest
            work/base/*SUMS*

      # Already compressed, so skip the artifact zip
      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-payload-${{ matrix.variant }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            out/*
            !out/*.img

  release:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.event.inputs.publish_release != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect build output
        uses: actions/download-artifact@v4
        with:
          pattern: release-payload-*
          merge-multiple: true
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/create-github-release.sh
