d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string frr-router
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/make-user boolean false

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/vda
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
  appliance :: \
    1 1 1 free \
      $bios_boot{ } \
      method{ biosgrub } \
    . \
    512 512 512 fat32 \
      $primary{ } \
      method{ efi } \
      format{ } \
    . \
    1024 4096 -1 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-auto/choose_recipe select appliance
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server sudo ca-certificates curl gnupg
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

d-i preseed/late_command string \
  wget -q http://10.0.2.2:8080/appliance-bundle.tar.gz -O /target/tmp/appliance-bundle.tar.gz ; \
  echo "__BUNDLE_SHA256__  /target/tmp/appliance-bundle.tar.gz" | sha256sum -c - ; \
  in-target mkdir -p /opt/frr-appliance-build ; \
  in-target tar -xzf /tmp/appliance-bundle.tar.gz -C /opt/frr-appliance-build ; \
  in-target /bin/bash /opt/frr-appliance-build/scripts/provision.sh __VARIANT__ ; \
  in-target rm -rf /opt/frr-appliance-build /tmp/appliance-bundle.tar.gz

d-i finish-install/reboot_in_progress note
