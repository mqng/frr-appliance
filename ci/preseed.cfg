# Locale / keyboard.
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i keyboard-configuration/xkb-keymap select us

# Network. QEMU user networking provides DHCP during the image build.
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/get_hostname string frr-router
d-i netcfg/get_domain string local

# Repository selection. Authentication remains enabled.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates

# No usable credentials are baked into the image. The appliance provisioner
# creates the locked/bootstrap admin account later and first boot sets its secret.
d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean false
# Seed these as well so a future installer component cannot fall through to a
# user-account prompt even though account creation is disabled.
d-i passwd/user-fullname string FRR Appliance Bootstrap
d-i passwd/username string appliance-bootstrap
d-i passwd/user-password-crypted password !

# Clock.
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Deterministic GPT layout: BIOS boot + EFI System Partition + growable root.
d-i partman-auto/disk string /dev/vda
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
  appliance :: \
    1 1 1 free \
      $bios_boot{ } \
      method{ biosgrub } \
    . \
    512 512 512 fat32 \
      $primary{ } \
      method{ efi } \
      format{ } \
    . \
    1024 4096 -1 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-auto/choose_recipe select appliance
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Continue without a swap partition; routing appliances do not need installer swap.
d-i partman-basicfilesystems/no_swap boolean false

# Package selection. Appliance provisioning installs the final package set.
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server sudo ca-certificates curl gnupg
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Bootloader. The build disk is always the virtio disk /dev/vda.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

# Provision the appliance from the exact repository payload prepared by CI.
# The payload is verified before extraction.
d-i preseed/late_command string \
  wget -q http://10.0.2.2:8080/appliance-bundle.tar.gz -O /target/tmp/appliance-bundle.tar.gz ; \
  echo "__BUNDLE_SHA256__  /target/tmp/appliance-bundle.tar.gz" | sha256sum -c - ; \
  in-target mkdir -p /opt/frr-appliance-build ; \
  in-target tar -xzf /tmp/appliance-bundle.tar.gz -C /opt/frr-appliance-build ; \
  in-target /bin/bash /opt/frr-appliance-build/scripts/provision.sh __VARIANT__ ; \
  in-target rm -rf /opt/frr-appliance-build /tmp/appliance-bundle.tar.gz

# Never stop at the final installer screen and never wait for media ejection.
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true
