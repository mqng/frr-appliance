#!/usr/sbin/nft -f

flush ruleset

table inet appliance {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    iif != "lo" ip saddr 127.0.0.0/8 drop
    iif != "lo" ip6 saddr ::1 drop

    icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
    icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, nd-redirect, mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } accept

    tcp dport 22 ct state new limit rate over 30/minute burst 20 packets drop
    tcp dport 22 accept comment "ssh"

    jump routing

    limit rate 5/minute burst 5 packets log prefix "appliance-input-drop " counter
  }

  chain routing {
    tcp dport 179 accept comment "bgpd"
    ip protocol 89 accept comment "ospfd"
    ip6 nexthdr 89 accept comment "ospf6d"
    udp dport 520 accept comment "ripd"
    udp dport 521 accept comment "ripngd"
    udp dport { 3784, 3785, 4784 } accept comment "bfdd"
    tcp dport 646 accept comment "ldpd"
    udp dport 646 accept comment "ldpd discovery"
    ip protocol 103 accept comment "pimd"
    ip6 nexthdr 103 accept comment "pim6d"
    ip protocol 2 accept comment "igmp"
    ip protocol 112 accept comment "vrrpd"
    ip6 nexthdr 112 accept comment "vrrpd"
    ip protocol 88 accept comment "eigrpd"
    udp dport 6696 accept comment "babeld"
    ip protocol 47 accept comment "nhrpd gre"
    ip protocol 54 accept comment "nhrpd"
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
    ct state invalid drop
  }
}

include "/etc/nftables.d/*.nft"
