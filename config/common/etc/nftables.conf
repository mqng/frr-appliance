#!/usr/sbin/nft -f
#
# Control-plane policy for the FRR appliance.
#
# input is default-deny with an explicit allowlist. The allowlist covers every
# protocol that /etc/frr/daemons is able to start, because the appliance
# contract is that activating a protocol in vtysh just works, with no
# configuration outside vtysh. The security gain is not fewer routing protocols
# but a closed, auditable control plane: anything that is not part of routing or
# managing this box is unreachable, and `nft list ruleset` states the surface.
#
# To narrow that surface, comment out protocols this router will never speak.
# That is the supported way to reduce exposure. Do not disable FRR daemons for
# this purpose: it also removes their vtysh commands.
#
# forward stays accept. This is a router; filtering transit traffic is an
# operator policy decision, not something a default image should impose.
#
# Local additions belong in /etc/nftables.d/*.nft so they survive edits to this
# file. See the README in that directory.

flush ruleset

# ICMP types are given numerically so the policy cannot break on an nft keyword
# spelling. Both families are mandatory, not optional hardening choices:
# blocking them breaks path-MTU discovery, and for IPv6 it breaks neighbour
# discovery, which takes the whole address family with it.
#
# v4: 0 echo-reply, 3 destination-unreachable, 8 echo-request, 11 time-exceeded,
#     12 parameter-problem
define icmp_allowed = { 0, 3, 8, 11, 12 }
#
# v6: 1 destination-unreachable, 2 packet-too-big, 3 time-exceeded,
#     4 parameter-problem, 128 echo-request, 129 echo-reply,
#     130-132 MLD query/report/done, 143 MLDv2 report,
#     133-137 router solicit, router advert, neighbour solicit,
#     neighbour advert, redirect
define icmp6_allowed = { 1, 2, 3, 4, 128, 129, 130, 131, 132, 143, 133, 134, 135, 136, 137 }

table inet appliance {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept comment "loopback: vtysh and every FRR vty socket"
    ct state established,related accept
    ct state invalid drop

    # Nothing off-box may claim a loopback source address.
    iif != "lo" ip saddr 127.0.0.0/8 drop
    iif != "lo" ip6 saddr ::1 drop

    icmp type $icmp_allowed accept
    icmpv6 type $icmp6_allowed accept

    # Management. sshd restricts this further with AllowUsers admin.
    tcp dport 22 ct state new limit rate over 30/minute burst 20 packets drop
    tcp dport 22 accept comment "ssh"

    jump routing

    # Rate-limited so a dropped control-plane packet is diagnosable without
    # letting a flood fill the journal.
    limit rate 5/minute burst 5 packets log prefix "appliance-input-drop " counter
  }

  # One rule per protocol /etc/frr/daemons can start. Protocol numbers are
  # explicit rather than named for the same reason as the ICMP types above.
  #
  # Not listed because they need no input rule:
  #   isisd  - IS-IS rides on 802.2 LLC, not IP, so this family never sees it
  #   pathd  - PCEP is an outbound session, covered by ct state established
  #   MPLS   - not IP; controlled by net.mpls.* in sysctl.d/99-frr-appliance.conf
  chain routing {
    tcp dport 179 accept comment "bgpd"
    ip protocol 89 accept comment "ospfd"
    ip6 nexthdr 89 accept comment "ospf6d"
    udp dport 520 accept comment "ripd"
    udp dport 521 accept comment "ripngd"
    udp dport { 3784, 3785, 4784 } accept comment "bfdd: control, echo, multihop"
    tcp dport 646 accept comment "ldpd session"
    udp dport 646 accept comment "ldpd discovery"
    ip protocol 103 accept comment "pimd"
    ip6 nexthdr 103 accept comment "pim6d"
    ip protocol 2 accept comment "igmp, used by pimd"
    ip protocol 112 accept comment "vrrpd"
    ip6 nexthdr 112 accept comment "vrrpd"
    ip protocol 88 accept comment "eigrpd"
    udp dport 6696 accept comment "babeld"
    ip protocol 47 accept comment "nhrpd: NHRP is carried in GRE"
    ip protocol 54 accept comment "nhrpd"
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
    ct state invalid drop
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

include "/etc/nftables.d/*.nft"
