[Unit]
# upstream After=network.target plus frr's Before is a cycle through vpp-lcp
After=
Requires=vpp-dpdk-prepare.service
After=vpp-dpdk-prepare.service

[Service]
ExecStart=
ExecStart=/usr/bin/vpp -c /run/appliance/vpp-startup.conf
Restart=on-failure
RestartSec=2s
LimitMEMLOCK=infinity
LimitNOFILE=131072
