[Unit]
# upstream has After=network.target, frr has Before, and vpp-lcp closes the
# cycle. VPP holds the NICs, so it goes ahead of network.target
After=
Requires=vpp-dpdk-prepare.service
After=vpp-dpdk-prepare.service

[Service]
ExecStart=
ExecStart=/usr/bin/vpp -c /run/appliance/vpp-startup.conf
Restart=on-failure
RestartSec=2s
LimitMEMLOCK=infinity
LimitNOFILE=131072
