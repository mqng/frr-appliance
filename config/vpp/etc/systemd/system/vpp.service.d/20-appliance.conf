[Unit]
# Upstream vpp.service declares After=network.target while frr.service declares
# Before=network.target. Together with vpp -> vpp-lcp -> frr that closes an
# ordering cycle, and systemd breaks it by dropping the frr.service job, so FRR
# never starts on this variant. VPP owns the NICs here, so it belongs on the
# provider side of network.target, not behind it. Reset the inherited ordering
# and state only what this appliance needs.
After=
Requires=vpp-dpdk-prepare.service
After=vpp-dpdk-prepare.service

[Service]
ExecStart=
ExecStart=/usr/bin/vpp -c /run/appliance/vpp-startup.conf
Restart=on-failure
RestartSec=2s
LimitMEMLOCK=infinity
LimitNOFILE=131072
